name: Generate Snake

on:
  schedule:
    # Her 12 saatte bir çalışır
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Hata durumunda takılı kalmaması için süre sınırı

    steps:
      # 1. Depoyu klonla
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Snake SVG grafiklerini üret
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kuvetliabdulkadir
          outputs: |
            # Bu çıktı, profilin koyu modda kullanılması içindir.
            # Kodların başındaki '#' işaretleri eklendi.
            dist/github-snake.svg?palette=github-dark&color_snake=#BA68C8&color_dots=#150A24,#4A148C,#7B1FA2,#9C27B0,#BA68C8

      # 3. Üretilen dosyaları 'output' dalına yükle (deploy)
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
