name: Generate Snake Animation

on:
  schedule:
    # Her 12 saatte bir otomatik çalışır
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Repoyu klonla
      - uses: actions/checkout@v4

      # 2. Snake SVG'sini standart dark tema parametreleriyle üret
      - uses: Platane/snk@v3
        with:
          github_user_name: kuvetliabdulkadir
          outputs: |
            dist/github-snake.svg?palette=github-dark

      # 3. Yükleme işlemini yap
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
